name: Deploy Book Reading Log to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 대시보드 데이터 자동 빌드 (build_dashboard.py)
        run: |
          python build_dashboard.py

      - name: GitHub Pages 환경 설정
        uses: actions/configure-pages@v5

      - name: 정적 파일 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: GitHub Pages로 배포
        id: deployment
        uses: actions/deploy-pages@v4

